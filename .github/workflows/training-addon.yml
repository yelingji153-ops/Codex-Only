name: Build training add-on
on:
  push:
    branches: [codex/acane-preprocessing]
    paths: [.github/workflows/training-addon.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_training_addon.py "$RUNNER_TEMP/ACAne-Training-Addon.zip"
      - name: Upload prepared draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view acane-training-v0.1.1-preview --json isDraft --jq .isDraft)" = true
          gh release upload acane-training-v0.1.1-preview "$RUNNER_TEMP/ACAne-Training-Addon.zip" "$RUNNER_TEMP/ACAne-Training-Addon.zip.sha256" --clobber
